<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">新系统全面升级上线</title>
  <desc id="desc">新系统全面升级公告，包含立即体验新系统按钮。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b63ce"/>
      <stop offset="1" stop-color="#0a8bd8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#063b80" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <path d="M-60 590 C150 440 180 690 390 552 S690 415 820 538 1080 650 1260 490" fill="none" stroke="#8dd4ff" stroke-opacity=".2" stroke-width="2"/>
  <path d="M-30 650 C170 500 245 735 450 590 S760 470 930 575 1120 680 1250 570" fill="none" stroke="#d8f2ff" stroke-opacity=".16" stroke-width="1.5"/>
  <circle cx="1030" cy="128" r="150" fill="#54c5ff" fill-opacity=".12"/>
  <circle cx="1110" cy="85" r="64" fill="#d6f4ff" fill-opacity=".12"/>

  <g filter="url(#shadow)">
    <rect x="160" y="96" width="880" height="568" rx="16" fill="#ffffff"/>
    <rect x="160" y="96" width="880" height="72" rx="16" fill="#f7fbff"/>
    <path d="M160 152 H1040" stroke="#e8eef5"/>
    <circle cx="202" cy="132" r="8" fill="#ff6b6b"/>
    <circle cx="228" cy="132" r="8" fill="#ffc857"/>
    <circle cx="254" cy="132" r="8" fill="#43c77a"/>
    <text x="600" y="138" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" fill="#728096">系统公告</text>

    <circle cx="600" cy="247" r="44" fill="#e8f5ff"/>
    <path d="M580 248 L594 262 L623 231" fill="none" stroke="#0b78d0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="600" y="332" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="32" font-weight="700" fill="#172b4d">新系统全面升级上线</text>
    <text x="600" y="382" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" font-weight="600" fill="#172b4d">系统已完成全面升级，新系统现已正式上线！</text>

    <text x="600" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5f6f85">为保障您的业务平稳迁移，我们将保留新旧系统共存一段时间，</text>
    <text x="600" y="468" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5f6f85">预计将在一个月内关闭旧系统。</text>
    <text x="600" y="514" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5f6f85">建议您尽快进入新系统体验，并逐步将日常业务迁移至新系统，</text>
    <text x="600" y="544" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" fill="#5f6f85">提前熟悉全新的功能与操作方式。</text>

    <rect x="445" y="580" width="310" height="52" rx="6" fill="#0b78d0"/>
    <text x="600" y="613" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="600" fill="#ffffff">立即体验新系统  →</text>
  </g>
</svg>
